[build-system]
# license_expression in setup.py requires setuptools >= 77
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.mypy]
strict = true

# Released versions of jsonpointer do not ship type information yet. Remove
# this once one does (and raise the jsonpointer requirement accordingly).
[[tool.mypy.overrides]]
module = ["jsonpointer"]
ignore_missing_imports = true
